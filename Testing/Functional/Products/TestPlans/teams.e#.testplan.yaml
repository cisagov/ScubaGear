ProductName: teams
TestPlan:
  - PolicyId: MS.TEAMS.2.2v2
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.TEAMS.2.2v2 Non-compliant - AllowTeamsConsumerInbound; AllowTeamsConsumer
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowTeamsConsumer = $true; AllowTeamsConsumerInbound = $true }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.2.2v2 Compliant - DoNotAllowTeamsConsumerInbound; AllowTeamsConsumer
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowTeamsConsumer = $true; AllowTeamsConsumerInbound = $false }"
        Postconditions: []
        ExpectedResult: true
      - TestDescription: MS.TEAMS.2.2v2 Compliant - AllowTeamsConsumerInbound; DoNotAllowTeamsConsumer
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowTeamsConsumer = $false; AllowTeamsConsumerInbound = $true }"
        Postconditions: []
        ExpectedResult: true
      - TestDescription: MS.TEAMS.2.2v2 Compliant - DoNotAllowTeamsConsumerInbound; DoNotAllowTeamsConsumer
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowTeamsConsumer = $false; AllowTeamsConsumerInbound = $false }"
        Postconditions: []
        ExpectedResult: true
  - PolicyId: MS.TEAMS.2.3v2
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.TEAMS.2.3v2 Non-compliant - AllowTeamsConsumer
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowTeamsConsumer = $true }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.2.3v2 Compliant - DoNotAllowTeamsConsumer
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowTeamsConsumer = $false }"
        Postconditions: []
        ExpectedResult: true
  - PolicyId: MS.TEAMS.4.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.TEAMS.4.1v1 Non-compliant - AllowEmailIntoChannel
        Preconditions:
          - Command: "Set-CsTeamsClientConfigurationRest -Identity Global -Settings @{ AllowEmailIntoChannel = $true }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.4.1v1 Compliant - Not AllowEmailIntoChannel
        Preconditions:
          - Command: "Set-CsTeamsClientConfigurationRest -Identity Global -Settings @{ AllowEmailIntoChannel = $false }"
        Postconditions: []
        ExpectedResult: true
