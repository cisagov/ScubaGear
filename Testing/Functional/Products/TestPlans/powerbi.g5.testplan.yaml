ProductName: powerbi
TestPlan:
  - PolicyId: MS.POWERBI.1.1v1
    TestDriver: ScubaCached
    Tests:
      - TestDescription: MS.POWERBI.1.1v1 Non-compliant - Publish to web is enabled
        Preconditions:
          - Command: UpdateProviderExport
            Splat:
              updates:
                powerbi_tenant_settings:
                  - settingName: setting1
                    title: "fake setting"
                    enabled: false
                    canSpecifySecurityGroups: false
                    tenantSettingGroup: "Admin API settings"
                  - settingName: PublishToWeb
                    title: "Publish to web"
                    enabled: true
                    canSpecifySecurityGroups: true
                    tenantSettingGroup: "Export and sharing settings"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.1.1v1 Non-compliant - Publish to web is disabled
        Preconditions:
          - Command: UpdateProviderExport
            Splat:
              updates:
                powerbi_tenant_settings:
                  - settingName: setting1
                    title: "fake setting"
                    enabled: false
                    canSpecifySecurityGroups: false
                    tenantSettingGroup: "Admin API settings"
                  - settingName: PublishToWeb
                    title: "Publish to web"
                    enabled: false
                    canSpecifySecurityGroups: true
                    tenantSettingGroup: "Export and sharing settings"
        Postconditions: []
        ExpectedResult: true

