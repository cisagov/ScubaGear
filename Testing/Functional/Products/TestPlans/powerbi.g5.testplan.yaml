                    title: "Service principals can call Fabric public APIs"
                    enabled: true
                    canSpecifySecurityGroups: true
                    tenantSettingGroup: "Developer settings"
                    enabledSecurityGroups: 
                      - graphId: = "532def94-d877-4c90-b7f0-466a7eeafb5e"
        Postconditions: []
        ExpectedResult: true

