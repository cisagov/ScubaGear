ProductName: teams
TestPlan:
  - PolicyId: MS.TEAMS.1.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.TEAMS.1.1v1 Non-compliant - Allows External Participant Give Request Control
        Preconditions:
          - Command: "Get-CsTeamsMeetingPolicyRest | Where-Object {$_.Identity -notin @('Tag:AllOn','Tag:AllOff','Tag:Kiosk','Tag:default','Tag:RestrictedAnonymousAccess','Tag:RestrictedAnonymousNoRecording')} | % {Set-CsTeamsMeetingPolicyRest -Identity $($_.Identity) -Settings @{ AllowExternalParticipantGiveRequestControl = $true }}"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.1.1v1 Compliant - Does not Allows  External Participant Give Request Control
        Preconditions:
          - Command: "Get-CsTeamsMeetingPolicyRest | Where-Object {$_.Identity -notin @('Tag:AllOn','Tag:AllOff','Tag:Kiosk','Tag:default','Tag:RestrictedAnonymousAccess','Tag:RestrictedAnonymousNoRecording')} | % {Set-CsTeamsMeetingPolicyRest -Identity $($_.Identity) -Settings @{ AllowExternalParticipantGiveRequestControl = $false }}"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.TEAMS.1.2v2
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.TEAMS.1.2v2 Non-compliant - Allows External Participant Give Request Control
        Preconditions:
