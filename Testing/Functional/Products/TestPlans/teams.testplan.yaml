        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.1.2v2 Compliant - Does not Allows  External Participant Give Request Control
        Preconditions:
          - Command: "Get-CsTeamsMeetingPolicyRest | Where-Object {$_.Identity -notin @('Tag:AllOn','Tag:AllOff','Tag:Kiosk','Tag:default','Tag:RestrictedAnonymousAccess','Tag:RestrictedAnonymousNoRecording')} | % {Set-CsTeamsMeetingPolicyRest -Identity $($_.Identity) -Settings @{ AllowAnonymousUsersToStartMeeting = $false }}"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.TEAMS.1.4v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.TEAMS.1.4v1 Non-compliant - AutoAdmittedUsers is Everyone
        Preconditions:
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AllowPSTNUsersToBypassLobby = $true }
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AutoAdmittedUsers = "Everyone" }
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.1.4v1 Non-compliant - AutoAdmittedUsers = InvitedUsers
        Preconditions:
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AutoAdmittedUsers = "InvitedUsers" }
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.1.4v1 Non-compliant - AutoAdmittedUsers = OrganizerOnly
        Preconditions:
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AllowPSTNUsersToBypassLobby = $false }
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AutoAdmittedUsers = "OrganizerOnly" }
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.1.4v1 Compliant - AutoAdmittedUsers = EveryoneInCompany
        Preconditions:
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AutoAdmittedUsers = "EveryoneInCompany" }
        Postconditions: []
        ExpectedResult: true
      - TestDescription: MS.TEAMS.1.4v1 Compliant - AutoAdmittedUsers = EveryoneInSameAndFederatedCompany
        Preconditions:
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AutoAdmittedUsers = "EveryoneInSameAndFederatedCompany" }
        Postconditions: []
        ExpectedResult: true
      - TestDescription: MS.TEAMS.1.4v1 Compliant - AutoAdmittedUsers = EveryoneInCompanyExcludingGuests
        Preconditions:
          - Command: Set-CsTeamsMeetingPolicyRest -Identity Global -Settings @{ AutoAdmittedUsers = "EveryoneInCompanyExcludingGuests" }
        Postconditions: []
        ExpectedResult: true

