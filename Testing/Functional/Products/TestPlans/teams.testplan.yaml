    Tests:
      - TestDescription: MS.TEAMS.2.1v2 Non-compliant - Allow all known domains
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowFederatedUsers = $true; AllowedDomains = @('AllowAllKnownDomains') }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.TEAMS.2.1v2 Compliant - Allow specific domain
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowFederatedUsers = $true; AllowedDomains = @('domains.r.us') }"
        Postconditions: []
        ExpectedResult: true
      - TestDescription: MS.TEAMS.2.1v2 Compliant - Do not allow federated users
        Preconditions:
          - Command: "Set-CsTenantFederationConfigurationRest -Identity Global -Settings @{ AllowFederatedUsers = $false }"
