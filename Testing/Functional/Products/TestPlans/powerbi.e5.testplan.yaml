ProductName: powerbi
TestPlan:
  - PolicyId: MS.POWERBI.1.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.1.1v1 Non-compliant - Publish to web is enabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'PublishToWeb' -Settings @{ Enabled = $true; }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.1.1v1 Compliant - Publish to web is disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'PublishToWeb' -Settings @{ Enabled = $false; }"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.2.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.2.1v1 Non-compliant - Guest access to shared content is enabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'AllowGuestUserToAccessSharedContent' -Settings @{ Enabled = $true; }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.2.1v1 Compliant - Guest access to shared content is disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'AllowGuestUserToAccessSharedContent' -Settings @{ Enabled = $false; }"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.3.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.3.1v1 Non-compliant - External sharing is enabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'ExternalSharingV2' -Settings @{ Enabled = $true; }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.3.1v1 Compliant - External sharing is disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'ExternalSharingV2' -Settings @{ Enabled = $false; }"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.4.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.4.1v1 Non-compliant - Service principal API access is enabled org-wide (not restricted to security groups)
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'ServicePrincipalAccessPermissionAPIs' -Settings @{ Enabled = $true; enabledSecurityGroups = @( ); }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.4.1v1 Compliant - Service principal API access is disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'ServicePrincipalAccessPermissionAPIs' -Settings @{ Enabled = $false}"
        Postconditions: []
        ExpectedResult: true
  - PolicyId: MS.POWERBI.4.1v1
    TestDriver: ScubaCached
    Tests:
      - TestDescription: MS.POWERBI.4.1v1 Compliant - Service principal API access is enabled and restricted to security groups
        Preconditions:
          - Command: UpdateProviderExport
            Splat:
              updates:
                powerbi_tenant_settings:
                  - settingName: setting1
                    title: "fake setting"
                    enabled: false
                    canSpecifySecurityGroups: false
                    tenantSettingGroup: "Admin API settings"
                  - settingName: ServicePrincipalAccessPermissionAPIs
                    title: "Service principals can call Fabric public APIs"
                    enabled: true
                    canSpecifySecurityGroups: true
                    tenantSettingGroup: "Developer settings"
                    enabledSecurityGroups:
                      - graphId: = "532def94-d877-4c90-b7f0-466a7eeafb5e"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.4.2v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.4.2v1 Non-compliant - Service principal profile creation is enabled org-wide (not restricted to security groups)
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'AllowServicePrincipalsCreateAndUseProfiles' -Settings @{ Enabled = $true; enabledSecurityGroups = @( ); }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.4.2v1 Compliant - Service principal profile creation is disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'AllowServicePrincipalsCreateAndUseProfiles' -Settings @{ Enabled = $false; enabledSecurityGroups = @( ); }"
        Postconditions: []
        ExpectedResult: true
  - PolicyId: MS.POWERBI.4.2v1
    TestDriver: ScubaCached
    Tests:
      - TestDescription: MS.POWERBI.4.2v1 Compliant - Service principal profile creation is enabled and restricted to security groups
        Preconditions:
          - Command: UpdateProviderExport
            Splat:
              updates:
                powerbi_tenant_settings:
                  - settingName: setting1
                    title: "fake setting"
                    enabled: false
                    canSpecifySecurityGroups: false
                    tenantSettingGroup: "Admin API settings"
                  - settingName: AllowServicePrincipalsCreateAndUseProfiles
                    title: "Allow service principals to create and use profiles"
                    enabled: true
                    canSpecifySecurityGroups: true
                    tenantSettingGroup: "Developer settings"
                    enabledSecurityGroups:
                      - graphId: = "532def94-d877-4c90-b7f0-466a7eeafb5e"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.5.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.5.1v1 Non-compliant - ResourceKey authentication is not blocked
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'BlockResourceKeyAuthentication' -Settings @{ Enabled = $false; }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.5.1v1 Compliant - ResourceKey authentication is blocked
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'BlockResourceKeyAuthentication' -Settings @{ Enabled = $true; }"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.6.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.6.1v1 Non-compliant - R and Python visuals are enabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'RScriptVisual' -Settings @{ Enabled = $true; }"
        Postconditions: []
        ExpectedResult: false
      - TestDescription: MS.POWERBI.6.1v1 Compliant - R and Python visuals are disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'RScriptVisual' -Settings @{ Enabled = $false; }"
        Postconditions: []
        ExpectedResult: true

  - PolicyId: MS.POWERBI.7.1v1
    TestDriver: RunScuba
    Tests:
      - TestDescription: MS.POWERBI.7.1v1 Non-compliant - Sensitivity labels are disabled
        Preconditions:
          - Command: "Set-PowerBITenantSetting -SettingName 'EimInformationProtectionEdit' -Settings @{ Enabled = $false; }"
        Postconditions: []
        ExpectedResult: false
  - PolicyId: MS.POWERBI.7.1v1
    TestDriver: ScubaCached
    Tests:
      - TestDescription: MS.POWERBI.7.1v1 Compliant - Sensitivity labels are enabled
        Preconditions:
          - Command: UpdateProviderExport
            Splat:
              updates:
                powerbi_tenant_settings:
                  - settingName: setting1
                    title: "fake setting"
                    enabled: false
                    canSpecifySecurityGroups: false
                    tenantSettingGroup: "Admin API settings"
                  - settingName: EimInformationProtectionEdit
                    title: "Allow users to apply sensitivity labels for content"
                    enabled: true
                    canSpecifySecurityGroups: true
                    tenantSettingGroup: "Information protection"
        Postconditions: []
        ExpectedResult: true
