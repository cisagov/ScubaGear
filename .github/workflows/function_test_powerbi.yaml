# Run functional tests for Power BI

name: Functional Tests Power BI

# This is a reusable workflow called by the pipeline.
on:
  workflow_call:
    inputs:
      EmailOnFailure:
        description: "True if an email should be sent when the workflow fails."
        required: true
        type: boolean
      GitHubEventSchedule:
        description: "A type of GitHub event"
        required: true
        type: string
      GitHubEventName:
        description: "The name of a GitHub event"
        required: true
        type: string
      SelectedProduct:
        description: "The product selected for testing"
        required: false
        type: string
        default: "all"
      RefName:
        description: "The branch or tag that triggered the workflow"
        required: false
        type: string
        default: ""
    secrets:
      PfxBase64:
        required: true
      PfxPassword:
        required: true
      TestParams:
        required: true
      TestParamsDev:
        required: true
      NotifierUsername:
        required: true
      NotifierPassword:
        required: true
permissions:
  id-token: write
  contents: write

jobs:
  PBI_Tenant1:
    name: PBI_Tenant1
    runs-on: windows-latest
    environment: Development
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: PowerBI_Tenant1
      cancel-in-progress: false
    outputs:
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
      skipped: ${{ steps.run-tests.outputs.skipped }}
      total: ${{ steps.run-tests.outputs.total }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Import PFX
        uses: ./repo/.github/actions/import-pfx
        with:
          PfxBase64: ${{ secrets.PfxBase64 }}
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Get Thumbprint
        id: get-thumbprint
        uses: ./repo/.github/actions/get-thumbprint
        with:
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Restore ScubaGear
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files\WindowsPowerShell\Modules\ScubaGear
          key: scubagear-directory-
      - name: Restore Dependencies
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\Documents\WindowsPowerShell\Modules
          key: powershell-directory-
      - name: Restore OPA
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\.scubagear\Tools
          key: opa-directory-
      - name: Test
        id: run-tests
        uses: ./repo/.github/actions/test-product
        with:
          Thumbprint: ${{ steps.get-thumbprint.outputs.thumbprint }}
          Alias: PBI_Tenant1
          TestParams: ${{ secrets.TestParams }}
  PBI_Tenant2:
    name: PBI_Tenant2
    runs-on: windows-latest
    environment: Development
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: PowerBI_Tenant2
      cancel-in-progress: false
    outputs:
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
      skipped: ${{ steps.run-tests.outputs.skipped }}
      total: ${{ steps.run-tests.outputs.total }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Import PFX
        uses: ./repo/.github/actions/import-pfx
        with:
          PfxBase64: ${{ secrets.PfxBase64 }}
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Get Thumbprint
        id: get-thumbprint
        uses: ./repo/.github/actions/get-thumbprint
        with:
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Restore ScubaGear
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files\WindowsPowerShell\Modules\ScubaGear
          key: scubagear-directory-
      - name: Restore Dependencies
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\Documents\WindowsPowerShell\Modules
          key: powershell-directory-
      - name: Restore OPA
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\.scubagear\Tools
          key: opa-directory-
      - name: Test
        id: run-tests
        uses: ./repo/.github/actions/test-product
        with:
          Thumbprint: ${{ steps.get-thumbprint.outputs.thumbprint }}
          Alias: PBI_Tenant2
          TestParams: ${{ secrets.TestParams }}
  PBI_Tenant6:
    name: PBI_Tenant6
    runs-on: windows-latest
    environment: Development
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: PowerBI_Tenant6
      cancel-in-progress: false
    outputs:
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
      skipped: ${{ steps.run-tests.outputs.skipped }}
      total: ${{ steps.run-tests.outputs.total }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Import PFX
        uses: ./repo/.github/actions/import-pfx
        with:
          PfxBase64: ${{ secrets.PfxBase64 }}
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Get Thumbprint
        id: get-thumbprint
        uses: ./repo/.github/actions/get-thumbprint
        with:
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Restore ScubaGear
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files\WindowsPowerShell\Modules\ScubaGear
          key: scubagear-directory-
      - name: Restore Dependencies
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\Documents\WindowsPowerShell\Modules
          key: powershell-directory-
      - name: Restore OPA
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\.scubagear\Tools
          key: opa-directory-
      - name: Test
        id: run-tests
        uses: ./repo/.github/actions/test-product
        with:
          Thumbprint: ${{ steps.get-thumbprint.outputs.thumbprint }}
          Alias: PBI_Tenant6
          TestParams: ${{ secrets.TestParams }}
  PBI_Tenant7:
    name: PBI_Tenant7
    runs-on: windows-latest
    environment: Development
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: PowerBI_Tenant7
      cancel-in-progress: false
    outputs:
      passed: ${{ steps.run-tests.outputs.passed }}
      failed: ${{ steps.run-tests.outputs.failed }}
      skipped: ${{ steps.run-tests.outputs.skipped }}
      total: ${{ steps.run-tests.outputs.total }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Import PFX
        uses: ./repo/.github/actions/import-pfx
        with:
          PfxBase64: ${{ secrets.PfxBase64 }}
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Get Thumbprint
        id: get-thumbprint
        uses: ./repo/.github/actions/get-thumbprint
        with:
          PfxPassword: ${{ secrets.PfxPassword }}
      - name: Restore ScubaGear
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files\WindowsPowerShell\Modules\ScubaGear
          key: scubagear-directory-
      - name: Restore Dependencies
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\Documents\WindowsPowerShell\Modules
          key: powershell-directory-
      - name: Restore OPA
        uses: actions/cache/restore@v6
        with:
          path: C:\Users\runneradmin\.scubagear\Tools
          key: opa-directory-
      - name: Test
        id: run-tests
        uses: ./repo/.github/actions/test-product
        with:
          Thumbprint: ${{ steps.get-thumbprint.outputs.thumbprint }}
          Alias: PBI_Tenant7
          TestParams: ${{ secrets.TestParams }}
  email:
    name: Email
    runs-on: windows-latest
    needs:
      - PBI_Tenant1
      - PBI_Tenant2
      - PBI_Tenant6
      - PBI_Tenant7
    if: ${{ failure() && (inputs.EmailOnFailure || inputs.GitHubEventName == 'schedule') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Extract Email
        id: extract-email
        uses: ./.github/actions/extract-email
        env:
          # Could use any of previous jobs as the alias
          Alias: PBI_Tenant1
          TestParams: ${{ secrets.TestParams }}
      - name: Notify on Failure
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NotifierUsername }}
          password: ${{ secrets.NotifierPassword }}
          subject: "ScubaGear Functional Test Failure - Power BI - branch: ${{ inputs.RefName || github.ref_name }}"
          to: ${{ steps.extract-email.outputs.emails }}
          from: ${{ format('ScubaGear Notifier <{0}>', secrets.NotifierUsername) }}
          body: |
            ScubaGear Functional Test Failure

            Product: Power BI
            Branch: ${{ inputs.RefName || github.ref_name }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Tenant Job Results:
              PBI_Tenant1: ${{ needs.PBI_Tenant1.result }} (${{ needs.PBI_Tenant1.outputs.passed }}/${{ needs.PBI_Tenant1.outputs.total }} passing, ${{ needs.PBI_Tenant1.outputs.failed }} failed)
              PBI_Tenant2: ${{ needs.PBI_Tenant2.result }} (${{ needs.PBI_Tenant2.outputs.passed }}/${{ needs.PBI_Tenant2.outputs.total }} passing, ${{ needs.PBI_Tenant2.outputs.failed }} failed)
              PBI_Tenant6: ${{ needs.PBI_Tenant6.result }} (${{ needs.PBI_Tenant6.outputs.passed }}/${{ needs.PBI_Tenant6.outputs.total }} passing, ${{ needs.PBI_Tenant6.outputs.failed }} failed)
              PBI_Tenant7: ${{ needs.PBI_Tenant7.result }} (${{ needs.PBI_Tenant7.outputs.passed }}/${{ needs.PBI_Tenant7.outputs.total }} passing, ${{ needs.PBI_Tenant7.outputs.failed }} failed)
