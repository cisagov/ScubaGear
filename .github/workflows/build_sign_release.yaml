# Purpose:  Build, sign, and check a draft release

name: Build and Draft Release

on:
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:Manual inputs are desired.
      releaseName:
        description: "Release Name"
        required: true
        type: string
      # Note: This is NOT the ACTUAL release version for ScubaGear.
      # That value is found in ScubaGear.psd1.
      # This is only used for things like the release file name.
      # Yes, this is a disconnect that violates DRY.
      # Note: It's possible that this value could be retrieved from ScubaGear.psd1
      # using a function similar to Set-ScubaGearVersionManifest in
      # utils/workflow/Set-ScubaGearModuleVersion.psm1.
      version:
        description: "Release Version (e.g., 1.2.4)"
        required: true
        type: string
      runQuickCheck:
        description: "Run a quick check of release"
        required: false
        type: boolean
        default: true
      compareHeadRef:
        description: "Compare head ref (branch or tag) for release notes, e.g. main or release/1.9.0. Defaults to the branch selected when running the workflow."
        required: false
        type: string
        default: ""

permissions: read-all

jobs:
  build-and-draft:
    name: Build and Draft Release
    runs-on: windows-latest
    environment: Development
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        shell: powershell
    # This condition prevents duplicate runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: repo
      - name: Install Azure Signing Tool
        run: |
          # Source the function
          . repo/utils/workflow/Install-AzureSignTool.ps1
          Install-AzureSignTool
      # OpenID Connect (OIDC) login to Azure Public Cloud with AzPowershell
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          . repo/utils/workflow/New-ReleaseNotes.ps1
          New-ReleaseNotes `
            -Version '${{ inputs.version }}' `
            -Owner '${{ github.repository_owner }}' `
            -Repository '${{ github.event.repository.name }}' `
            -CompareHeadRef '${{ inputs.compareHeadRef }}' `
            -RefName '${{ github.ref_name }}' `
            -ServerUrl '${{ github.server_url }}' `
            -OutputPath 'release-body.md'
      - name: Get Key Vault info
        id: key-vault-info
        uses: ./repo/.github/actions/get-keyvault-info
        with:
          key-vault-info: ${{ secrets.SCUBA_KEY_VAULT_PROD }}
          checkout-path: repo
      - name: Sign Module
        run: |
          . repo/utils/workflow/Build-SignRelease.ps1
          New-ModuleSignature `
            -AzureKeyVaultUrl ${{ steps.key-vault-info.outputs.key-vault-url }} `
            -CertificateName ${{ steps.key-vault-info.outputs.certificate-name }} `
            -ReleaseVersion ${{ inputs.version }} `
            -RootFolderName "repo"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        id: create-release
        with:
          draft: true
          prerelease: false
          name: ${{ inputs.releaseName }}
          tag_name: v${{ inputs.version }}
          body_path: release-body.md
          files: |
            ScubaGear-${{ inputs.version }}.zip
            ScubaGear-${{ inputs.version }}/PowerShell/ScubaGear/schemas/ScubaBaselines.json
          fail_on_unmatched_files: true
      - name: Download Release
        if: ${{ inputs.runQuickCheck }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ inputs.version }}" --repo "${{ github.repository }}" --pattern "ScubaGear-${{ inputs.version }}.zip" --clobber
      - name: Quick Check Release
        if: ${{ inputs.runQuickCheck }}
        run: |
          Expand-Archive -Path "ScubaGear-${{ inputs.version }}.zip"
          Get-ChildItem
          Set-Location -Path "ScubaGear-${{ inputs.version }}"
          Import-Module -Name .\PowerShell\ScubaGear\ScubaGear.psd1
          Invoke-SCuBA -Version
