# Purpose: Run unit tests for OPA

name: Unit Test OPA

# This is a reusable workflow called by the pipeline.
on:
  workflow_call:
  workflow_dispatch:

permissions: read-all

env:
  MODULE_ROOT: PowerShell/ScubaGear

jobs:
  opa-tests:
    name: OPA Unit Tests
    runs-on: ubuntu-latest
    # This condition prevents duplicate runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Get current OPA version
        id: get-current-opa-version
        shell: pwsh
        run: |
          $ScubaConfigDefaultsPath = "./${{ env.MODULE_ROOT }}/Modules/ScubaConfig/ScubaConfigDefaults.json"
          if (-not (Test-Path -PathType Leaf -Path $ScubaConfigDefaultsPath)) {
             throw "Fatal Error: Couldn't find ScubaConfigDefaults.json at path $ScubaConfigDefaultsPath"
          }
          $Raw = Get-Content -Path $ScubaConfigDefaultsPath -Raw
          $ConfigDefaults = $Raw | ConvertFrom-Json
          $CurrentOPAVersion = $ConfigDefaults.defaults.OPAVersion
          echo currentopaversion=$CurrentOPAVersion >> $env:GITHUB_OUTPUT
      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: "${{ steps.get-current-opa-version.outputs.currentopaversion }}"
      - name: Run OPA Check
        run: opa check ${{ env.MODULE_ROOT }}/Rego ${{ env.MODULE_ROOT }}/Testing/Unit/Rego --strict
      - name: Run OPA Tests
        run: opa test ${{ env.MODULE_ROOT }}/Rego/*.rego ${{ env.MODULE_ROOT }}/Rego/Utils/*.rego ${{ env.MODULE_ROOT }}/Testing/Unit/Rego/**/*.rego -v
      - name: Setup Regal
        uses: open-policy-agent/setup-regal@v2.0.0
      - name: Run Regal Lint
        run: regal lint --format github ${{ env.MODULE_ROOT }}/Rego ${{ env.MODULE_ROOT }}/Testing
