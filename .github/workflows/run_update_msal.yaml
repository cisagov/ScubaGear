name: Check pinned MSAL dependencies

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  update-msal-dependency:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect MSAL update
        id: detect
        run: |
          . ./utils/workflow/Update-Msal.ps1
          $result = Confirm-MsalUpdateRequirements -RepoRoot .
          $result | ConvertTo-Json | Write-Output
          "updateRequired=$($result.UpdateRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "currentVersion=$($result.CurrentVersion)" >> $env:GITHUB_OUTPUT
          "latestVersion=$($result.LatestVersion)" >> $env:GITHUB_OUTPUT
          if ($result.State -eq 'QueryFailed') { throw $result.Summary }

      - name: Restore updated signed dependencies
        if: steps.detect.outputs.updateRequired == 'true'
        run: |
          . ./utils/workflow/Update-Msal.ps1
          Update-MsalDependencyVersion `
            -RepoRoot . `
            -Version '${{ steps.detect.outputs.latestVersion }}' | Out-Null
          Test-MsalDependencyIntegrity -RepoRoot .

      - name: Run MSAL workflow tests
        if: steps.detect.outputs.updateRequired == 'true'
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          $result = Invoke-Pester -Path ./Testing/workflow/Update-Msal.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) MSAL workflow tests failed." }

      - name: Create update pull request
        if: steps.detect.outputs.updateRequired == 'true'
        env:
          CURRENT_VERSION: ${{ steps.detect.outputs.currentVersion }}
          LATEST_VERSION: ${{ steps.detect.outputs.latestVersion }}
        run: |
          $branch = "msal-version-bump-$env:LATEST_VERSION"
          if (git ls-remote --exit-code --heads origin $branch) {
            Write-Output "Branch $branch already exists; skipping duplicate pull request."
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add --force PowerShell/ScubaGear/RequiredVersions.ps1
          git commit -m "Update pinned MSAL dependencies to $env:LATEST_VERSION"
          git push origin $branch

          $body = @"
          Updates the pinned, signed MSAL dependency set from $env:CURRENT_VERSION to $env:LATEST_VERSION.

          - NuGet repository signatures verified
          - Authenticode publishers verified
          - SHA-256 manifest regenerated in RequiredVersions.ps1
          - Integrity tests passed

          This update must not be merged until delegated system-browser and certificate authentication smoke tests pass.
          "@
          $arguments = @(
            'pr', 'create',
            '--base', '${{ github.event.repository.default_branch }}',
            '--head', $branch,
            '--title', "Update pinned MSAL dependencies to $env:LATEST_VERSION",
            '--body', $body
          )
          gh @arguments
